<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Creator preview illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" rx="40" />
  <circle cx="220" cy="180" r="120" fill="url(#accent)" opacity="0.6" />
  <circle cx="980" cy="180" r="140" fill="#38bdf8" opacity="0.35" />
  <circle cx="900" cy="640" r="160" fill="#f97316" opacity="0.35" />
  <rect x="120" y="110" width="960" height="580" rx="30" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
  <text x="150" y="260" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">Creator Studio</text>
  <text x="150" y="360" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="34">Real uploads are now playable directly from the audience feed.</text>
  <text x="150" y="440" fill="#fcd34d" font-family="Arial, Helvetica, sans-serif" font-size="30">Published media • Artist-first discovery • Audience listening</text>
  <rect x="150" y="520" width="280" height="84" rx="18" fill="url(#accent)" />
  <text x="195" y="572" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Play preview</text>
</svg>
